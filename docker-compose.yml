# Local / single-host deployment:  docker compose up --build   ->  http://localhost:8080
# Required: copy .env.example to .env and fill JWT_ACCESS_SECRET and GEMINI_API_KEY.
services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      # One reverse proxy (the nginx in the client container) sits in front of the API.
      TRUST_PROXY: "1"
      # Plain HTTP on localhost. Set to "true" (the production default) once TLS terminates in front.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # No published port: only the client's nginx can reach the API.

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:8080"

